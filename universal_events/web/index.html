<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composer · proactive agent</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3240;
    --tx:#e6edf3; --dim:#8b949e; --dim2:#6e7781;
    --patch:#58a6ff; --create:#bc8cff; --campaign:#3fb950;
    --add:#3fb950; --del:#f85149; --warn:#d29922; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  a{color:var(--accent)}

  header{display:flex;align-items:center;gap:16px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--dim2);font-size:12px}
  .pills{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill b{color:var(--tx);font-weight:600}
  .pill.ok b{color:var(--campaign)} .pill.bad b{color:var(--del)}

  .bar{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);
    align-items:center;flex-wrap:wrap;background:var(--panel)}
  button{font:inherit;font-size:13px;padding:6px 13px;border-radius:6px;cursor:pointer;
    background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
  button:hover{border-color:var(--dim2)}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  button.primary:hover{background:#2a7aff}
  button.danger{background:transparent;border-color:#5c2626;color:#f0a0a0}
  button:disabled{opacity:.45;cursor:default}
  select{font:inherit;font-size:13px;padding:6px 8px;background:var(--panel2);
    color:var(--tx);border:1px solid var(--line);border-radius:6px}
  .spacer{flex:1}
  .tabs{display:flex;gap:4px}
  .tab{padding:6px 13px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--dim)}
  .tab.on{background:var(--panel2);color:var(--tx)}

  main{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 106px)}
  .col{overflow-y:auto;padding:14px 16px}
  .col.left{border-right:1px solid var(--line);background:#11161d}
  .single{grid-column:1/-1}

  .sect{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim2);
    margin:0 0 9px;font-weight:600}

  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:7px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .card:hover{border-color:var(--dim2)}
  .card.sel{border-color:var(--accent);background:var(--panel2)}
  .card.patch{border-left-color:var(--patch)}
  .card.create{border-left-color:var(--create)}
  .card.campaign{border-left-color:var(--campaign)}
  .card .hl{font-weight:500;margin:3px 0 5px;font-size:13px}
  .card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

  .tag{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);text-transform:uppercase;
    letter-spacing:.5px;font-weight:600}
  .tag.patch{color:var(--patch);border-color:#1f4e79}
  .tag.create{color:var(--create);border-color:#4c3575}
  .tag.campaign{color:var(--campaign);border-color:#1f5c2e}
  .tag.trigger{color:var(--warn);border-color:#5c4a1a}
  .tag.sweep{color:var(--dim);}
  .tag.approved{color:var(--campaign)} .tag.revised{color:var(--warn)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-bottom:14px}
  .panel h3{margin:0 0 8px;font-size:13px;font-weight:600}
  .quiet{color:var(--dim);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;padding:3px 9px;border-radius:5px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim)}
  .chip.hot{color:var(--create);border-color:#4c3575}

  pre.diff{margin:0;padding:12px;background:#0b0f14;border:1px solid var(--line);
    border-radius:7px;overflow-x:auto;font-size:12.5px;line-height:1.6}
  .dl{display:block;white-space:pre-wrap}
  .dl.add{color:var(--add);background:rgba(63,185,80,.09)}
  .dl.remove{color:var(--del);background:rgba(248,81,73,.09)}
  .dl.meta{color:var(--patch);opacity:.8}
  .dl.context{color:var(--dim)}

  ul.findings{margin:6px 0 0;padding-left:18px;color:var(--tx)}
  ul.findings li{margin-bottom:5px}

  .msg{background:#0b0f14;border:1px solid var(--line);border-radius:7px;padding:13px}
  .msg .subj{font-weight:600;margin-bottom:9px}
  .msg .body{white-space:pre-wrap;color:#cdd9e5;font-size:13px}

  .revtabs{display:flex;gap:6px;margin-bottom:10px}
  .revtab{font-size:12px;padding:4px 11px;border-radius:5px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .revtab.on{color:var(--tx);border-color:var(--accent)}

  .fb{width:100%;min-height:74px;background:#0b0f14;color:var(--tx);
    border:1px solid var(--line);border-radius:7px;padding:10px;font:inherit;
    font-size:13px;resize:vertical}
  .actions{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    color:var(--dim2);font-size:11.5px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim2);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:.6px;padding:6px 10px 6px 0;
    border-bottom:1px solid var(--line)}
  td{padding:7px 10px 7px 0;border-bottom:1px solid #1b212b;vertical-align:top}

  .learned{border-left:3px solid var(--create);padding:8px 12px;background:var(--panel2);
    border-radius:0 6px 6px 0;margin-bottom:7px}
  .banner{padding:10px 14px;border-radius:7px;margin-bottom:12px;font-size:13px}
  .banner.ok{background:rgba(63,185,80,.12);border:1px solid #1f5c2e}
  .banner.learn{background:rgba(188,140,255,.12);border:1px solid #4c3575}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--dim2);
    border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;
    vertical-align:-1px}
  @keyframes s{to{transform:rotate(360deg)}}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:12.5px}
  .kv dt{color:var(--dim2)} .kv dd{margin:0}

  /* Business notifications. Elias's phrasing: these interrupt you, rather
     than waiting in a list you remember to check. So they behave like a
     notification -- they arrive, they ask, they resolve. */
  #toasts{position:fixed;right:20px;bottom:20px;width:392px;z-index:90;
    display:flex;flex-direction:column;gap:11px}
  .toast{background:#1a212c;border:1px solid #2f3a4a;border-left:3px solid var(--accent);
    border-radius:9px;padding:13px 15px;box-shadow:0 12px 34px rgba(0,0,0,.55);
    animation:slide .34s cubic-bezier(.2,.9,.3,1)}
  .toast.patch{border-left-color:var(--patch)}
  .toast.create{border-left-color:var(--create)}
  .toast.campaign{border-left-color:var(--campaign)}
  .toast.done{border-left-color:var(--campaign)}
  @keyframes slide{from{opacity:0;transform:translateX(34px) scale(.97)}
                   to{opacity:1;transform:none}}
  .thead{display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .tdot{width:7px;height:7px;border-radius:50%;background:var(--warn);
    box-shadow:0 0 0 3px rgba(210,153,34,.18);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(210,153,34,0)}}
  .tlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--dim);font-weight:700}
  .tclose{margin-left:auto;background:none;border:none;color:var(--dim2);
    padding:0 2px;font-size:14px;cursor:pointer}
  .tnoticed{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:6px}
  .tfix{font-size:12.5px;color:var(--dim);margin-bottom:11px;line-height:1.5}
  .tfix b{color:var(--tx);font-weight:500}
  .tactions{display:flex;gap:7px}
  .tactions button{font-size:12.5px;padding:6px 11px}
  .tfb{width:100%;min-height:58px;background:#0b0f14;color:var(--tx);
    border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;
    font-size:12.5px;resize:vertical;margin-bottom:8px}
  .tdone{font-size:12.5px;color:var(--campaign);display:flex;align-items:center;gap:7px}
  .tlearned{font-size:12px;color:var(--create);margin-top:8px;padding-top:8px;
    border-top:1px solid var(--line);line-height:1.5}
  .tquiet{background:#141a23;border:1px solid var(--line);border-left:3px solid var(--dim2);
    border-radius:9px;padding:10px 14px;font-size:12.5px;color:var(--dim);
    animation:slide .34s cubic-bezier(.2,.9,.3,1)}
  .tquiet b{color:var(--tx)}
  .tquiet a{cursor:pointer}

  .chatwrap{max-width:900px}
  .prompts{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
  .pchip{font-size:12px;padding:6px 11px;border-radius:99px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .pchip:hover{color:var(--tx);border-color:var(--dim2)}
  .chatrow{display:flex;gap:8px}
  .chatin{flex:1;background:#0b0f14;color:var(--tx);border:1px solid var(--line);
    border-radius:8px;padding:11px 13px;font:inherit;font-size:13.5px}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:11px 14px;margin:14px 0 0;font-size:13.5px}
  .bubble.you{border-left:3px solid var(--accent)}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin-top:14px;
    border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .vs .side{padding:13px 15px}
  .vs .side.a{background:rgba(210,153,34,.06)}
  .vs .side.b{background:rgba(63,185,80,.06)}
  .vs .mid{display:flex;align-items:center;padding:0 10px;color:var(--dim2);
    background:var(--panel);border-left:1px solid var(--line);
    border-right:1px solid var(--line);font-size:11px}
  .vs h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.7px}
  .vs .side.a h4{color:var(--warn)} .vs .side.b h4{color:var(--campaign)}
  .vs .line{font-size:12.5px;margin-bottom:8px;line-height:1.5}
  .vs .line b{color:var(--tx)}
  .warnbox{background:rgba(210,153,34,.1);border:1px solid #5c4a1a;border-radius:8px;
    padding:11px 14px;margin-top:12px;font-size:12.5px;line-height:1.55}

  .strat{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:8px;
    margin-bottom:12px;font-size:12.5px;border:1px solid var(--line)}
  .strat.llm{background:rgba(188,140,255,.1);border-color:#4c3575}
  .strat.heuristic{background:rgba(88,166,255,.08);border-color:#1f4e79}
  .strat.config{background:rgba(63,185,80,.08);border-color:#1f5c2e}
  .strat .who{font-weight:600}
  .strat.llm .who{color:var(--create)}
  .strat.heuristic .who{color:var(--patch)}
  .strat.config .who{color:var(--campaign)}
  .strat .why{color:var(--dim);margin-left:auto;text-align:right;font-size:11.5px}
  .chain{font-size:11.5px;color:var(--dim2);margin-top:9px}
  .chain code{background:var(--panel2);padding:1px 6px;border-radius:4px;
    border:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <h1>Composer <span class="sub">· proactive agent prototype</span></h1>
  <div class="pills" id="pills"></div>
</header>

<div class="bar">
  <div class="tabs" id="tabs">
    <div class="tab on" data-v="proposals">Proposals</div>
    <div class="tab" data-v="chat">Chat · today</div>
    <div class="tab" data-v="ingest">Event ingest</div>
    <div class="tab" data-v="flows">Flows</div>
    <div class="tab" data-v="activity">Activity</div>
  </div>
  <div class="spacer"></div>
  <select id="evt"></select>
  <button id="fire">Fire event →</button>
  <button id="arm" title="Fires an event in 20s so the notification interrupts you">Arm notification (20s)</button>
  <button id="sweep" class="primary">Run sweep now</button>
  <button id="reset">Reset demo</button>
</div>

<main id="main"></main>

<div id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c;
  if(h!==undefined)e.innerHTML=h; return e; };
const esc = s => String(s??'').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (p,o) => (await fetch('/api'+p, o?{method:'POST',
  headers:{'Content-Type':'application/json'}, body:JSON.stringify(o)}:{})).json();
const money = v => {
  if(v==null) return '—';
  const n = Number(v);
  if(n === 0) return '$0.00';
  if(n < 0.01) return '$'+n.toFixed(4).replace(/0+$/,'').replace(/\.$/,'.0');
  return '$'+n.toFixed(2);
};

let S = { view:'proposals', proposals:[], sel:null, detail:null, rev:null,
          corrections:[], runs:[], flows:[], sources:null, ingest:null,
          signals:[], chat:[], prompts:[], busy:null };

/* ---------------------------------------------------------------- status */
async function status(){
  const s = await api('/status');
  $('#pills').innerHTML = `
    <span class="pill ${s.klaviyo.ok?'ok':'bad'}">Klaviyo <b>${s.klaviyo.ok?'live':'down'}</b></span>
    <span class="pill">model <b>${esc(s.model)}</b></span>
    <span class="pill">spent <b>${money(s.spent_usd)}</b></span>
    <span class="pill">events <b>${s.events}</b></span>
    <span class="pill">flows <b>${s.flows}</b></span>
    <span class="pill">pending <b>${s.proposals.pending}</b></span>`;
}

/* ------------------------------------------------------------- proposals */
function card(p){
  const c = el('div', `card ${p.kind}${S.sel===p.id?' sel':''}`);
  if(p.status === 'superseded') c.style.opacity = '.45';
  c.innerHTML = `<div class="meta">
      <span class="tag ${p.kind}">${p.kind}</span>
      <span class="tag ${p.origin}">${p.origin==='trigger'?'⚡ trigger':'🕐 sweep'}</span>
      ${p.status!=='pending'?`<span class="tag ${p.status}">${p.status}</span>`:''}
      ${p.supersedes && p.supersedes.length?`<span class="tag create">absorbed ${p.supersedes.length}</span>`:''}
      ${p.revision_count>1?`<span class="tag">rev ${p.revision_count}</span>`:''}
    </div>
    <div class="hl">${esc(p.headline)}</div>
    <div class="quiet" style="font-size:11.5px">${esc(p.flow_name)}</div>`;
  c.onclick = () => select(p.id);
  return c;
}

async function select(id){
  S.sel = id; S.rev = null;
  S.detail = await api('/proposals/'+id);
  S.rev = S.detail.revisions.length;
  render();
}

function diffBlock(diff){
  if(!diff || !diff.length) return '';
  const pre = el('pre','diff');
  diff.forEach(d => pre.appendChild(el('span','dl '+d.kind,
    esc((d.kind==='add'?'+':d.kind==='remove'?'-':' ')+d.text))));
  return pre;
}

function detailView(){
  const wrap = el('div');
  if(!S.detail){
    const intro = el('div','panel');
    intro.innerHTML = `<h3>What it is watching right now</h3>
      <div class="quiet">These are computed by query, not by a model — the agent
      cites these numbers rather than inventing them. Nothing has been proposed yet.</div>`;
    wrap.appendChild(intro);
    if(!S.signals.length){
      wrap.appendChild(el('div','quiet','No signals. Try <b>Reset demo</b>.'));
      return wrap;
    }
    S.signals.forEach(sig => {
      const sev = sig.severity==='high' ? 'var(--del)'
                : sig.severity==='medium' ? 'var(--warn)' : 'var(--dim)';
      const box = el('div','panel');
      box.style.borderLeft = `3px solid ${sev}`;
      box.innerHTML = `<div class="meta" style="display:flex;gap:6px;margin-bottom:6px">
          <span class="tag">${esc(sig.severity)}</span>
          <span class="tag">${esc(sig.scope)} scope</span>
          <span class="tag">${esc(sig.kind)}</span>
        </div>
        <div style="font-weight:500;margin-bottom:4px">${esc(sig.title)}</div>
        <div class="quiet">${esc(sig.detail)}</div>`;
      wrap.appendChild(box);
    });
    wrap.appendChild(el('div','quiet',
      '<div style="margin-top:4px">Hit <b>Run sweep now</b> to see what it decides to do about these.</div>'));
    return wrap;
  }
  const p = S.detail;
  const r = p.revisions[(S.rev||p.revisions.length)-1];

  if(p.status==='approved'){
    if(p.kind==='campaign'){
      const k = (p.revisions[p.revisions.length-1].drafted_campaign||{}).klaviyo;
      if(k && k.ok){
        wrap.appendChild(el('div','banner ok',
          `✓ Created in Klaviyo as a <b>Draft</b> campaign — `
          + `<b>${k.profiles_added}</b> profiles added to the audience.<br>`
          + `<a href="${esc(k.campaign_url)}" target="_blank">open it in Klaviyo →</a>`
          + `<div class="quiet" style="margin-top:6px">Nothing was sent. A human presses send.</div>`
          + (k.warnings && k.warnings.length
              ? `<div class="quiet" style="margin-top:4px">${k.warnings.map(esc).join('<br>')}</div>` : '')));
      } else if(k){
        wrap.appendChild(el('div','warnbox',
          `Approved locally, but Klaviyo creation failed: ${esc(k.error||'unknown')}`));
      } else {
        wrap.appendChild(el('div','banner ok',
          `✓ Approved for <b>${p.sent_to}</b> recipients <span class="quiet">(recorded locally)</span>`));
      }
    } else {
      wrap.appendChild(el('div','banner ok',
        `✓ Applied — flow is now <b>v${p.applied_version}</b>`));
    }
  }

  const head = el('div','panel');
  head.innerHTML = `<div class="meta" style="display:flex;gap:6px;margin-bottom:7px">
      <span class="tag ${p.kind}">${p.kind}</span>
      <span class="tag ${p.origin}">${p.origin==='trigger'?'⚡ trigger':'🕐 sweep'}</span>
      <span class="tag">${esc(p.signal_scope)} scope</span>
      ${p.corrections_applied?`<span class="tag create">${p.corrections_applied} learned correction${p.corrections_applied>1?'s':''} applied</span>`:''}
    </div>
    <div style="font-size:16px;font-weight:600;margin-bottom:3px">${esc(r.headline)}</div>
    <div class="quiet">${esc(p.flow_name)}</div>`;
  wrap.appendChild(head);

  if(p.revisions.length>1){
    const rt = el('div','revtabs');
    p.revisions.forEach(x => {
      const t = el('div','revtab'+((S.rev||p.revisions.length)===x.n?' on':''),
        'revision '+x.n+(x.n===1?'':' · after your feedback'));
      t.onclick = () => { S.rev = x.n; render(); };
      rt.appendChild(t);
    });
    wrap.appendChild(rt);
  }

  if(p.supersedes && p.supersedes.length){
    wrap.appendChild(el('div','banner learn',
      `<b>This replaces an earlier proposal for the same flow.</b><br>`
      + p.supersedes.map(x => '· ' + esc(x)).join('<br>')
      + `<div class="quiet" style="margin-top:6px">Two open edits to one
         automation can't both be approved, so the newer finding absorbs the
         older one.</div>`));
  }
  if(p.status === 'superseded'){
    wrap.appendChild(el('div','warnbox',
      `Superseded by a newer proposal for this flow`
      + (p.superseded_by ? ` (<b>${esc(p.superseded_by)}</b>)` : '') + '.'));
  }

  const noticed = el('div','panel');
  noticed.innerHTML = `<h3>What it noticed</h3>
    <div style="margin-bottom:7px">${esc(p.signal_title)}</div>
    <div class="quiet">${esc(r.observation)}</div>`;
  wrap.appendChild(noticed);

  const ctx = el('div','panel');
  ctx.innerHTML = `<h3>Context it pulled first</h3>`;
  const chips = el('div','chips');
  (p.context_lines||[]).forEach(l => chips.appendChild(
    el('span','chip'+(/correction/.test(l)&&!/no learned/.test(l)?' hot':''), esc(l))));
  ctx.appendChild(chips);
  wrap.appendChild(ctx);

  if(r.prompted_by_feedback){
    const fb = el('div','panel');
    fb.innerHTML = `<h3>This revision came from your feedback</h3>
      <div style="font-style:italic;color:#cdd9e5">“${esc(r.prompted_by_feedback)}”</div>`;
    wrap.appendChild(fb);
  }

  const audit = el('div','panel');
  audit.innerHTML = `<h3>What it audited</h3><div>${esc(r.audit_summary)}</div>`
    + (r.findings&&r.findings.length
        ? `<ul class="findings">${r.findings.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>` : '');
  wrap.appendChild(audit);

  if(r.drafted_campaign){
    const c = r.drafted_campaign;
    const box = el('div','panel');
    box.innerHTML = `<h3>The campaign it wrote</h3>
      <dl class="kv">

        <dt>counted by</dt><dd class="quiet">${esc(c.audience_basis)}</dd>
        <dt>for example</dt><dd class="quiet">${esc((c.audience_sample||[]).join(', '))}</dd>

      </div>`;
    wrap.appendChild(box);
  } else if(r.diff && r.diff.length){
    const box = el('div','panel');
    box.innerHTML = `<h3>The change it made
      <span class="quiet" style="font-weight:400">— diff produced by applying the patch</span></h3>`;

        '<div style="margin-top:9px">'+r.ops.map(o=>'· '+esc(o)).join('<br>')+'</div>'));

  if(r.predicted_impact){
    wrap.appendChild(el('div','panel',
      `<h3>What it expects to change</h3><div>${esc(r.predicted_impact)}</div>`));
  }

  if(p.status==='pending'||p.status==='revised'){
    const act = el('div','panel');
    act.innerHTML = `<h3>Does this look right?</h3>
      <textarea class="fb" id="fbtx" placeholder="Not right? Say why, in plain words — e.g. our donors are older, don't use SMS"></textarea>`;
    const row = el('div','actions');
    const ok = el('button','primary','✓ Approve'+(p.kind==='campaign'?' & send':p.kind==='create'?' & create flow':' & apply'));
    ok.onclick = async () => {
      ok.disabled=true; ok.innerHTML='<span class="spin"></span> applying…';
      await api(`/proposals/${p.id}/approve`,{}); await refresh(); await select(p.id);
    };
    const no = el('button','danger','✕ Reject with feedback');
    no.onclick = async () => {
      const txt = $('#fbtx').value.trim();
      if(!txt){ $('#fbtx').focus(); return; }
      no.disabled=true; no.innerHTML='<span class="spin"></span> revising…';
      const res = await api(`/proposals/${p.id}/reject`,{feedback:txt});
      await refresh(); await select(p.id);
      if(res.learned && res.learned.length){
        const b = el('div','banner learn',
          '<b>Learned from that — it won’t need telling again:</b><br>'
          + res.learned.map(c=>`· ${esc(c.rule)} <span class="quiet">(${esc(c.vertical||'all verticals')})</span>`).join('<br>'));
        $('#detail').prepend(b);
      }
    };
    row.appendChild(ok); row.appendChild(no);
    act.appendChild(row);
    wrap.appendChild(act);
  }

  wrap.appendChild(el('div','foot',
    `${r.source==='llm'?'generated by':'deterministic fallback —'} <b>${esc(r.model||'rules engine')}</b>
     · ${money(r.cost_usd)} · ${r.latency_ms||0}ms · confidence ${Math.round((r.confidence||0)*100)}%
     ${r.fallback_reason?`<br><span style="color:var(--warn)">fell back: ${esc(r.fallback_reason)}</span>`:''}`));
  return wrap;
}

// A business notification has to earn the interruption. Elias's distinction
// was notifications vs PUSH notifications, and the difference is restraint --
// an agent that interrupts eight times in a row has become the thing he was
// contrasting against. So only the ones that deserve attention now interrupt;
// everything else lands quietly in the inbox with a count.
const MAX_TOASTS = 2;
let quietCount = 0;

function deservesInterrupt(p){
  // Triggers are urgent by nature: something just happened to one person.
  if(p.origin === 'trigger') return true;
  // From a scheduled sweep, only high-severity findings interrupt.
  return p.signal_severity === 'high';
}

function renderQuiet(){
  const stack = $('#toasts');
  let row = stack.querySelector('.tquiet');
  if(!quietCount){ if(row) row.remove(); return; }
  if(!row){
    row = el('div','tquiet');
    stack.appendChild(row);
  }
  row.innerHTML = `<b>${quietCount}</b> more waiting in the inbox `
    + `<span style="opacity:.7">— not urgent enough to interrupt</span>`;
  row.onclick = () => { S.view='proposals'; render(); quietCount = 0; renderQuiet(); };
}

function notify(p){
  if(seen.has(p.id)) return;
  seen.add(p.id);

  if(!deservesInterrupt(p)){
    quietCount += 1;
    renderQuiet();
    return;
  }

  const stack = $('#toasts');
  const quiet = stack.querySelector('.tquiet');
  stack.insertBefore(toastFor(p), stack.firstChild);

  // Anything beyond the cap becomes a quiet count rather than a stack.
  const toasts = [...stack.querySelectorAll('.toast')];
  if(toasts.length > MAX_TOASTS){
    toasts.slice(MAX_TOASTS).forEach(t => { t.remove(); quietCount += 1; });
  }
  if(quiet){ stack.appendChild(quiet); }
  renderQuiet();
}

function dropStaleToasts(){
  // A toast whose proposal no longer exists, or is no longer open, is lying to
  // the user. Happens after a reset, or when something supersedes it.
  const live = new Set(
    S.proposals.filter(p => p.status === 'pending' || p.status === 'revised')
               .map(p => p.id));
  [...$('#toasts').querySelectorAll('.toast')].forEach(t => {
    const id = t.dataset.id;
    // Resolved toasts keep their id but are mid-fade; leave those alone.
    if(id && !live.has(id) && !t.classList.contains('done')) t.remove();
  });
  if(!S.proposals.length){ quietCount = 0; renderQuiet(); }
}

async function poll(){
  try{
    // Runs and corrections are fetched too: an armed notification fires
    // server-side with no click, so nothing else would ever refresh them and
    // the Activity tab would sit frozen at page-load state.
    const [d, r, c] = await Promise.all([
      api('/proposals'), api('/runs'), api('/corrections')]);
    const vanished = S.sel && !d.proposals.some(p => p.id === S.sel);
    S.proposals = d.proposals;
    S.runs = r.runs;
    S.corrections = c.corrections;

    // Only genuinely new, still-open proposals interrupt. A superseded one
    // has been replaced, so it must never interrupt.
    d.proposals.filter(p => p.status === 'pending' && !seen.has(p.id))
               .reverse().forEach(notify);
    d.proposals.filter(p => p.status === 'superseded').forEach(p => seen.add(p.id));
    dropStaleToasts();

    if(vanished){
      // The open proposal was deleted underneath us -- a reset, most likely.
      S.sel = null; S.detail = null; seen.clear();
      if(S.view === 'proposals') render();
    } else if(S.view === 'proposals'){
      // Left column only, so a half-typed rejection survives the poll.
      refreshInbox();
    } else if(S.view === 'activity'){
      render();
    }
    await status();
  }catch(e){ /* polling must never break the page */ }
}

/* ----------------------------------------------------------------- wire */
document.querySelectorAll('.tab').forEach(t =>
  t.onclick = () => { S.view=t.dataset.v; render(); });

$('#sweep').onclick = async () => {
  const b=$('#sweep'); b.disabled=true; b.innerHTML='<span class="spin"></span> thinking…';
  const res = await api('/sweep',{}); await refresh();
  b.disabled=false; b.textContent='Run sweep now';
  S.view='proposals';
  if(res.created?.length) await select(res.created[0].id); else render();
};

$('#fire').onclick = async () => {
  const [source,sample] = $('#evt').value.split('|');
  const b=$('#fire'); b.disabled=true; b.innerHTML='<span class="spin"></span> sending…';
  const res = await api('/trigger',{source,sample}); await refresh();
  b.disabled=false; b.textContent='Fire event →';
  S.view='proposals';
  if(res.created?.length) await select(res.created[0].id); else render();
};

$('#arm').onclick = async () => {
  const b = $('#arm'); b.disabled = true;
  const res = await api('/demo/arm', {});
  let left = Math.round(res.in_seconds);
  b.textContent = `notification in ${left}s…`;
  const tick = setInterval(() => {
    left -= 1;
    if(left <= 0){ clearInterval(tick); b.disabled = false;
                   b.textContent = 'Arm notification (20s)'; }
    else b.textContent = `notification in ${left}s…`;
  }, 1000);
};

$('#reset').onclick = async () => {
  const b=$('#reset'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  await api('/reset',{}); S.sel=null; S.detail=null; S.ingest=null;
  seen.clear(); quietCount = 0; $('#toasts').innerHTML='';
  await refresh(); b.disabled=false; b.textContent='Reset demo'; render();
};

(async function init(){
  S.sources = await api('/sources');
  S.prompts = (await api('/chat/suggestions')).prompts;
  const opts = S.sources.sources.flatMap(s =>
    s.samples.map(x => ({v:`${s.key}|${x.key}`, t:`${s.tool} · ${x.label}`})));
  const KEY = 'fitness|class_no_show';
  opts.sort((a,b) => (a.v===KEY?-1:b.v===KEY?1:0));
  $('#evt').innerHTML = opts.map(o =>
    `<option value="${o.v}">${esc(o.t)}</option>`).join('');
  $('#evt').selectedIndex = 0;
  await refresh();
  S.proposals.forEach(p => seen.add(p.id));
  render();
  pollTimer = setInterval(poll, 4000);
})();
</script>
